services:
  postgres-db:
    image: postgres:18-alpine
    container_name: codeflow_db
    restart: always
    environment:
      POSTGRES_DB: codeflow_db
      POSTGRES_USER: root
      POSTGRES_PASSWORD: Farmacos123qwe
    ports:
      - "5432:5432"
    volumes:
      - ./init-scripts:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: keycloak_app
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-db:5432/keycloak_db
      KC_DB_USERNAME: root
      KC_DB_PASSWORD: Farmacos123qwe
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
    ports:
      - "8080:8080"
    depends_on:
      - postgres-db

volumes:
  pgdata: